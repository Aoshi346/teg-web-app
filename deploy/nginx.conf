# ─── TEG Web App — Nginx Reverse Proxy Config ───
#
# SETUP:
#   1. Copy to /etc/nginx/sites-available/teg-web
#   2. Symlink: sudo ln -s /etc/nginx/sites-available/teg-web /etc/nginx/sites-enabled/
#   3. Test:   sudo nginx -t
#   4. Reload: sudo systemctl reload nginx
#
# DOMAIN: tesisfar.elevaiti.com
#   - /api/*   → Django backend (port 8000)
#   - /*       → Next.js frontend (port 3000)
#
# SSL (once DNS is pointing):
#   sudo certbot --nginx -d tesisfar.elevaiti.com
#

server {
    listen 80;
    listen [::]:80;
    server_name tesisfar.elevaiti.com;

    # ─── API / Backend ───
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ─── Media / Static (Django) ───
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
    }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
    }

    # ─── Frontend ───
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
