<!doctype html>
<html lang="es">
<!--
  PLANTILLA · página de documentación / explainer con nav lateral fija + secciones ancladas.
  Para guías, referencias, explainers multi-sección. Rellena la nav y las <section id>.
-->
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>[Título] — doc</title>
<style>
  :root{--ink:#1b1b1f;--muted:#6b6b76;--faint:#9a9aa4;--paper:#f6f4ef;--card:#fff;--line:#e4e0d7;--navy:#1b2a4a;--accent:#c2410c;--mono:ui-monospace,Menlo,Consolas,monospace;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6}
  .layout{display:grid;grid-template-columns:230px 1fr;max-width:1100px;margin:0 auto}
  nav.side{position:sticky;top:0;align-self:start;height:100vh;overflow:auto;border-right:1px solid var(--line);padding:24px 16px}
  nav.side .brand{font-family:var(--mono);font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.12em;margin-bottom:14px}
  nav.side a{display:block;color:var(--muted);text-decoration:none;font-size:13.5px;padding:5px 8px;border-radius:7px}
  nav.side a:hover{background:#fff;color:var(--ink)}
  main{padding:32px 28px 80px;min-width:0}
  .eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 8px}
  h1{font-size:30px;margin:0 0 8px;letter-spacing:-.02em}.lead{color:var(--muted);max-width:74ch}
  section{padding:24px 0;border-bottom:1px solid var(--line)}h2{font-size:21px;margin:0 0 8px;scroll-margin-top:14px}
  p,li{max-width:76ch}code{font-family:var(--mono);font-size:.88em;background:#efece4;color:var(--navy);padding:2px 6px;border-radius:6px}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;font-size:13.5px;margin:8px 0}
  th,td{padding:9px 13px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:#fbfaf7;font-size:11px;text-transform:uppercase;color:var(--muted)}
  tr:last-child td{border-bottom:none}.note{background:#fdebd9;border:1px solid #f3c9a8;border-left:4px solid var(--accent);border-radius:10px;padding:12px 16px;color:#7c2d12;font-size:14px}
  @media(max-width:780px){.layout{grid-template-columns:1fr}nav.side{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}}
</style>
</head>
<body><div class="layout">
<nav class="side">
  <div class="brand">[sección]</div>
  <a href="#s1">[Sección 1]</a>
  <a href="#s2">[Sección 2]</a>
  <a href="#s3">[Sección 3]</a>
</nav>
<main>
  <p class="eyebrow">[etiqueta · fecha]</p>
  <h1>[Título de la página]</h1>
  <p class="lead">[Resumen de qué cubre y para quién.]</p>
  <section id="s1"><h2>[Sección 1]</h2><p>[contenido]</p></section>
  <section id="s2"><h2>[Sección 2]</h2><p>[contenido]</p></section>
  <section id="s3"><h2>[Sección 3]</h2><p>[contenido]</p></section>
</main>
</div></body>
</html>
