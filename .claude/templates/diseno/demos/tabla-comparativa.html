<!--
  T22 · arquetipo 4 de 4 — la tabla comparativa.
  Precedente: bien/consultorpro.html:1773 — la ÚNICA <table> de los 10 diseños del corpus.
  (Aquí se citaba también elevaiti-v7 y es falso: no tiene ninguna. Un solo precedente = anécdota,
  no patrón.)
  Doctrina: patterns/diseno/demo-de-producto.md

  Por qué está aquí: es lo que el ranking HUMANO premió («comparativa IA vs humano» aparece en sus
  razones). Responde la pregunta que la persona ya se está haciendo — «¿y esto en qué se diferencia
  de lo que hago ahora?» — en vez de esperar a que la formule.

  La condición que separa una comparativa de un anuncio: **la columna del rival dice cosas
  CIERTAS**, incluidas las que gana. Una tabla donde el rival pierde en todo no se cree nadie y
  quema la confianza de todo lo demás de la página.

  Es una <table> de verdad: se navega con teclado y un lector de pantalla la lee como tabla.
-->
<style>
 :root{--bg:#fff;--tinta:#1a1a1a;--linea:#e8e8e8;--nuestro:#0d1b2a;--ok:#1a7f5a}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f7f5;color:var(--tinta);
      font-family:system-ui,sans-serif;padding:2rem}
 table{width:min(640px,94vw);border-collapse:collapse;background:var(--bg);border-radius:12px;overflow:hidden;
       box-shadow:0 4px 20px rgba(13,27,42,.06)}   /* sombra teñida */
 caption{text-align:left;padding:1rem 1.1rem;font-weight:600}
 th,td{padding:.85rem 1.1rem;text-align:left;border-top:1px solid var(--linea);font-size:.95rem}
 thead th{border-top:0;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
 tbody th{font-weight:500}

</style></head><body>
 <table>
  <caption>Cómo se compara, con lo que cada opción hace de verdad</caption>
