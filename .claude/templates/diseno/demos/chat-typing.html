<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo · chat con indicador</title>
<!--
  T22 · arquetipo 1 de 4 — el chat que se escribe solo.
  Precedente: resources/referencias-diseno/bien/elevaiti-v5.html:756-761 (PRIMERA del ranking humano).
  Doctrina: patterns/diseno/demo-de-producto.md

  Por qué gana a una ilustración: enseña el producto FUNCIONANDO. Quien lo ve entiende en 4
  segundos qué hace, sin leer una lista de características.

  Las tres condiciones que lo hacen aceptable, y ninguna es opcional:
   1. `aria-live="polite"` — un lector de pantalla se entera de cada mensaje nuevo.
   2. Sin JS, la conversación COMPLETA ya está en el HTML: el JS la esconde y la va soltando.
   3. Con `prefers-reduced-motion`, sale entera de golpe. No hay «versión degradada rota».
-->
<style>
 :root{--bg:#0d1b2a;--burbuja:#16283d;--mio:#00b4d8;--txt:#f8f9fa;--dur:400ms;--ease:cubic-bezier(.16,1,.3,1)}
 body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--txt);
      font-family:system-ui,sans-serif}
 .chat{width:min(420px,92vw);border:1px solid #ffffff1a;border-radius:16px;padding:1.25rem;display:grid;gap:.6rem}
 .msg{max-width:80%;padding:.7rem .95rem;border-radius:14px;background:var(--burbuja);line-height:1.5}
 .msg[data-de="usuario"]{margin-left:auto;background:var(--mio);color:#06131f}
 body.js-ready .msg{opacity:0;transform:translateY(8px);transition:opacity var(--dur) var(--ease),transform var(--dur) var(--ease)}
 body.js-ready .msg.visible{opacity:1;transform:none}
 .escribiendo{display:none;gap:.25rem;padding:.8rem 1rem;background:var(--burbuja);border-radius:14px;width:max-content}
 body.js-ready .escribiendo.activo{display:flex}
 .escribiendo i{width:6px;height:6px;border-radius:50%;background:#ffffff80;animation:bote 1.2s ease-in-out infinite}
 .escribiendo i:nth-child(2){animation-delay:.15s}.escribiendo i:nth-child(3){animation-delay:.3s}
 @keyframes bote{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
 @media (prefers-reduced-motion:reduce){
   body.js-ready .msg{opacity:1!important;transform:none!important;transition:none!important}
   .escribiendo{display:none!important}.escribiendo i{animation:none}
 }
</style></head><body>
 <div class="chat" role="log" aria-live="polite" aria-label="Conversación de ejemplo">
   <div class="msg" data-de="usuario">¿Tenéis hueco el jueves por la tarde?</div>
   <div class="msg">Sí: 17:00 y 18:30. ¿Cuál te va mejor?</div>
   <div class="msg" data-de="usuario">A las 18:30.</div>
   <div class="msg">Reservado. Te mando el recordatorio el miércoles.</div>
   <div class="escribiendo" aria-hidden="true"><i></i><i></i><i></i></div>
 </div>
<script>
(function(){
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce) return;                       // sin JS-ready: la conversación se queda visible entera
  document.body.classList.add('js-ready');
  var msgs=[].slice.call(document.querySelectorAll('.msg')),
      esc=document.querySelector('.escribiendo'), i=0;
  (function soltar(){
    if(i>=msgs.length){esc.classList.remove('activo');return;}
    var m=msgs[i++], suyo=m.dataset.de!=='usuario';
    esc.classList.toggle('activo', suyo);
    setTimeout(function(){ esc.classList.remove('activo'); m.classList.add('visible');
                           setTimeout(soltar, 600); }, suyo?900:250);
  })();
})();
</script></body></html>
