<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Grano — pegable</title>
<!--
  grano.html — textura de grano con feTurbulence en un data-uri: cero peticiones de red.
  Precedentes: mal/attomo-digital.html:97 · bien/elevaiti-v5.html:200 ·
               bien/dale-marketing-v4/styles.css:351   (3 diseños distintos)
  Doctrina: patterns/diseno/textura-y-profundidad.md

  Para qué sirve: rompe el plano liso del fondo y hace que un color grande deje de parecer una
  superficie de plantilla. Se nota a 0,025-0,05 de opacidad; por encima de 0,08 se ve sucio.
-->
<style>
  .grano{
    position: fixed; inset: 0; z-index: 9999;
    pointer-events: none;          /* sin esto, la capa se come todos los clics */
    opacity: .028;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  /* Animarlo cuesta pintar toda la pantalla en cada fotograma: solo en nivel 2, y nunca con
     reduced motion. */
  @media (prefers-reduced-motion: no-preference){
    .grano--vivo{ animation: grano 8s steps(10) infinite; }
    @keyframes grano{
      0%,100%{transform:translate(0,0)}      20%{transform:translate(-2%,-3%)}
      40%{transform:translate(-4%,2%)}       60%{transform:translate(2%,-4%)}
      80%{transform:translate(-1%,3%)}
    }
  }
  body{min-height:100vh;margin:0;background:#1a1410;color:#f5efe6;display:grid;place-items:center;font-family:system-ui}
</style>
</head>
<body>
  <div class="grano" aria-hidden="true"></div>
  <p>El fondo lleva grano. Quita la capa y compara.</p>
</body>
</html>
