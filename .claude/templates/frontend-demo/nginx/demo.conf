# Vhost de la demo: SPA de Vite + API de Django detrás (plantilla de templates/frontend-demo, AN-22).
# Sustituye <dominio>, <raiz-del-build> y <puerto-api>. La aplicación escucha en 127.0.0.1; aquí solo
# nginx da la cara en 80/443 (rules/security.md §NINGÚN puerto se expone).
#
# Lo que este fichero arregla, medido en fitapp (Lighthouse móvil 49 → 92-94):
#   · compresión: el `gzip_types` de /etc/nginx/nginx.conf viene COMENTADO en Debian/Ubuntu, y sin él
#     solo se comprime text/html — el JS y el CSS iban enteros;
#   · HTTP/2: `http2 on;` debajo de `listen 443 ssl;` cuando certbot haya puesto el certificado;
#   · caché: /assets/ lleva hash en el nombre → un año e immutable; sw.js, index.html y el manifiesto,
#     no-cache, o el aviso de versión nueva de la PWA no llega nunca.

server {
    server_name <dominio>;
    root <raiz-del-build>;
    index index.html;

    # listen 443 ssl;      ← lo añade certbot
    # http2 on;            ← y esto, a mano, debajo

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    # text/html no se lista: con `gzip on` va siempre (listarlo da aviso de tipo duplicado).
    gzip_types text/css text/plain text/javascript application/javascript application/json
               application/manifest+json image/svg+xml;

    # ⚠️ Cada `add_header` de un `location` REEMPLAZA los del `server`: por eso se repiten abajo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://127.0.0.1:<puerto-api>;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
