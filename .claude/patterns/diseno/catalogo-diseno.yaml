      catálogo solo sabe contar el primero — por eso la columna `estado` mide frecuencia y esta nota
      dice lo otro. Quien la use, que sepa que la apuesta se apoya en una elección de quien paga,
      no en una costumbre.
    nota: >
      Las dos son de elevaiti-v5, PRIMERA del ranking humano: el chat con indicador de escritura
      (:756) y la calculadora con tres deslizadores reales (:2366). · CORREGIDO el 2026-09-18: aquí
      se citaba `elevaiti-v7.html:1801` como calculadora y **no lo es** — es una tarjeta flotante
      con la cifra «ROI Automatización +347%». v7 tiene CERO `type="range"`. El `RANKING.csv` se la
      atribuye a V7 y el fichero dice otra cosa; la discrepancia se deja escrita en
      demo-de-producto.md §1 en vez de resolverla a favor de lo que quedaba mejor.

