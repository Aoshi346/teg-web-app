# ─────────────────────────────────────────────────────────────────────────────
# catalogo-diseno.yaml — las técnicas del canon de diseño DECLARADO.
#
# NO es `../catalog.yaml`, y la diferencia es el fichero entero:
#   ../catalog.yaml   patrones MEDIDOS en ESTE repo (dominancia ≥85%). Los lee Rita.
#                     Los aplica `hooks/pattern-check.sh`. Bloquean.
#   este fichero      técnicas DECLARADAS, medidas en un corpus AJENO a este repo
#                     (`resources/referencias-diseno/`, 10 diseños propios de 2026).
#                     Rita NO lo lee. `pattern-check.sh` NO lo grepea. NO bloquea nada.
#
# Por qué se puede hacer esto sin romper la regla de dominancia: precedente GAP-1 de
# `../README.md` §1 — las 10 reglas `ag-*` están medidas en dos repos y los dos son
# nuestros, así que siguen en `sombra` y su comprobador imprime esa procedencia. Aquí
# pasa lo mismo, un escalón más abajo: DIEZ DISEÑOS DE UN SOLO EQUIPO NO SON DOMINANCIA.
# Puede ser simplemente nuestro gusto, y por eso nada de aquí bloquea.
#
# ESTADOS — y esta columna es la mitad del valor del fichero:
#   patron    la técnica aparece en ≥2 diseños DISTINTOS del corpus
#   anecdota  aparece en UNO solo. Se conserva porque es útil, pero no se presenta
#             como «así se hace aquí»: se presenta como «esto lo hicimos una vez»
#   regla     no entra por frecuencia sino por el COSTE MEDIDO de no hacerlo
#             (hoy solo T11b, y su justificación es el fallo real de attomo)
#
# Cada precedente se verificó con `sed -n` antes de escribirlo, y
# `scripts/verificar_precedentes.py` lo vuelve a comprobar en cada cambio: si un fichero
# del corpus se mueve o se acorta, este catálogo falla en vez de mentir.
# ─────────────────────────────────────────────────────────────────────────────
version: 1
declarado: true
medido_en: resources/referencias-diseno   # corpus externo a este repo
generado: "2026-09-18"
bloquea: false
lee_rita: false

tecnicas:
