    doc: tipografia.md
    estado: patron
    precedentes: ["bien/kalinayoga-v6.html:326", "bien/kalinayoga-v4.html:39", "bien/elevaiti-v2.html:2075"]
    conflicto_con: "frontend-design lista «accenting just a single word or phrase in a headline» como señal de IA. Ver tipografia.md §Conflicto: el tell es el cromo aplicado a cualquier tema; esto es una decisión de composición que la dirección de arte tiene que justificar."

