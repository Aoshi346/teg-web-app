# Entradas PROPUESTAS del patrón de casa FRONTEND — para integrar en el catálogo (no las integro yo).
# Generado por el agente de patrón frontend (US-7). Hermano: _catalog-entries-backend.yaml.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────
# LEER ANTES DE INTEGRAR: estas filas NO pueden ir tal cual a `.claude/patterns/catalog.yaml`.
#
# El catálogo de este repo tiene una regla dura (README.md, RESEARCH.md del plan de Rita):
#     «un patrón entra con dominancia MEDIDA (≥85% activo · 60-85% débil) y ≥2 precedentes file:line».
# Estas filas no la cumplen y no pueden cumplirla: en `tech-lead-template` no hay una sola línea de
# React de la que medir dominancia. Son patrones DECLARADOS (el "patrón de casa" que US-7 pide para
# proyectos NUEVOS), no INFERIDOS. Es la distinción que el propio README ya hace entre catalog.yaml
# (se mide) y ownership.yaml (se declara) — y estas filas caen del lado declarado.
#
# Por eso llevan dos campos que el schema actual no tiene, y que hay que aprobar o sustituir:
#     origen: casa      → declarado por decisión (vs `medido`, inferido del repo)
#     referencia:       → sustituye a `precedentes` mientras no haya código real que citar
#
# RECOMENDACIÓN (decisión del Usuario / TL):
#   Estas filas son una SEMILLA, no filas del catálogo de este repo. Su sitio natural es que
#   `/project-setup` las copie al `catalog.yaml` del proyecto DERIVADO cuando el repo está vacío
#   (la rama "proyecto nuevo" de US-7), y que en la rama "proyecto existente" NO se copien: allí
#   manda el patrón medido del repo (QA-2), y estas quedan como propuesta a discutir.
#   Si en cambio se integran en el catálogo de la plantilla, deben ir en `sombra` (solo miden) para
#   que no bloqueen nada aquí, donde no aplican.
#
# ESTADO AL ARRANCAR UN PROYECTO NUEVO: `activo` las que la tabla marca como tal. Es legítimo porque
# en un repo vacío la dominancia de una regla nueva es trivialmente del 100% (no hay violaciones
# preexistentes) y la "regla de inversión" (>20-30 sitios marcados ⇒ la mala es la regla) no se
# puede disparar. En un repo CON código hay que medir primero: correr el checker con `--all` y, si
# una regla marca medio repo, baja a `debil` o al baseline. No al revés.
# ─────────────────────────────────────────────────────────────────────────────────────────────
#
# Mecanismo (escalón más barato posible, igual que en el catálogo):
#   script  → .claude/patterns/stack/pattern_check_frontend.py   (determinista, 0 tokens, stdlib)
#   lint    → regla de ESLint nombrada (más precisa: AST; exige que el proyecto instale el plugin)
#   runtime → axe-core dentro del test (lo que no se puede saber sin ejecutar)
#
# Verificación — ahora es REPRODUCIBLE, no una nota de quien las escribió:
#   python3 .claude/patterns/stack/pattern_check_frontend.py --self-test
#   · 37/37 reglas disparan sobre los fixtures INFRACTORES  → sensibilidad
#   ·  0 hallazgos sobre los 10 ficheros CONFORMES          → FPR 0% medido
#   · exit 1 con violaciones activas, exit 0 en limpio, `pattern-exempt: <id>` respetado
# Los fixtures van embebidos en el propio script (FIXTURES_CONFORME / FIXTURES_INFRACTOR) y se
# materializan en un temporal: `_fixtures/` es del comprobador de backend y no se toca.

project: "<proyecto derivado>"
seeded_from: tech-lead-template
stack: "React · TypeScript · Vite ↔ Django/DRF"
checker: .claude/patterns/stack/pattern_check_frontend.py

