  # ── capa stack — qué librerías se instalan (FE-1) ─────────────────────────────────────────
  # Eje nuevo en el frontend: `4-dependencias`, tomado prestado del catálogo de backend, que ya
  # lo usa para lo mismo. `7-seguridad` también es nuevo: el frontend tenía `3-errores` (fallos
  # que ve el usuario) pero ningún eje para lo que explota alguien a propósito.
  - id: fe-stack-canonico
    enunciado: "Un solo papel, una sola librería: nada de Formik junto a RHF ni Yup junto a zod"
    eje: 4-dependencias
    capa: stack
    mecanismo: script
    ambito: "package.json"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
    referencia: "stack/frontend-stack.md §Implementación de referencia (la tabla de papeles)"
    doc: stack/frontend-stack.md
    nota: >
      DÉBIL a propósito y es la decisión más discutible del set: al aterrizar en un repo existente
      esta regla y su hermana son las que más van a disparar, y bloquear un package.json bloquea
      también al proyecto que hereda código y no puede migrar hoy. Falso positivo conocido: MUI
      arrastra @emotion/styled sin que nadie lo haya elegido.

  - id: fe-version-mayor-del-canon
    enunciado: "La versión mayor es la del canon (react-query 5 · zod 4 · react-router 7 · tailwind 4 · react ≥18)"
    eje: 4-dependencias
    capa: stack
    mecanismo: script
    ambito: "package.json"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
    referencia: "stack/frontend-stack.md §Implementación de referencia (package.json de referencia)"
    doc: stack/frontend-stack.md
    nota: >
      Verificado con context7 (2026-08-08): TanStack Query va por v5 para React; zod 4 deprecó
      z.string().email() en favor de z.email(); react-router 7 usa Component/ErrorBoundary, que
      tienen prioridad sobre element/errorElement; tailwind 4 configura el tema en CSS con @theme.
      Comprueba lo DECLARADO, no lo instalado (eso está en el lockfile) ni que el paquete exista
      (eso es code-review-gate).

  # ── capa estilos — Tailwind e iconos (FE-1) ───────────────────────────────────────────────
  - id: fe-iconos-tree-shakeable
    enunciado: "Los iconos se importan por su nombre; nunca `import * as` de lucide-react"
    eje: 4-dependencias
    capa: estilos
    mecanismo: script
    ambito: "src/**/*.{ts,tsx}"
    origen: casa
