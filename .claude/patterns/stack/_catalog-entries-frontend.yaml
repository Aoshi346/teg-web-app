    doc: stack/estilos.md
    nota: >
      Verificado en la doc de lucide (2026-08-08): el paquete es ESM y por tanto tree-shakeable,
      y para nombres decididos en ejecución la vía sancionada es el mapa de imports dinámicos.
      El namespace impide al empaquetador demostrar qué sobra: >1.700 iconos en el bundle. No
      rompe nada — solo hace la página más lenta, que es por lo que nadie lo ve.

  - id: fe-escala-de-tailwind
    enunciado: "Valores de la escala, no arbitrarios, en p/m/gap/text/rounded/leading"
    eje: 1-estructura
    capa: estilos
    mecanismo: script      # refuerzo: prettier-plugin-tailwindcss + Tailwind IntelliSense
    ambito: "src/**/*.tsx"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
