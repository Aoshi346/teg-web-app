    doc: stack/estilos.md
    nota: "w- y h- quedan fuera a propósito: un ancho fijo en px es legítimo a menudo."

  - id: fe-clases-con-helper
    enunciado: "Las clases condicionales pasan por cn() (clsx + tailwind-merge), no por plantilla"
    eje: 1-estructura
    capa: estilos
    mecanismo: script      # refuerzo: eslint-plugin-better-tailwindcss
    ambito: "src/**/*.tsx"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
    referencia: "stack/estilos.md §Implementación de referencia (el ayudante cn())"
    doc: stack/estilos.md
    nota: >
      El motivo no es estético: al concatenar, entre `px-2` y `px-4` gana la que Tailwind escribió
      última EN LA HOJA, no la última del string. Comprobar el choque de verdad exigiría conocer
      las clases generadas para el tema del proyecto, así que la regla comprobable es "pasa por
      cn()", no "no tengas conflictos".

  - id: fe-apply-con-reference
    enunciado: "@apply en hoja de ámbito propio (module.css/vue/svelte) exige @reference"
    eje: 1-estructura
    capa: estilos
    mecanismo: script
    ambito: "**/*.module.{css,scss,sass,less}, **/*.{vue,svelte}"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
    referencia: "stack/estilos.md §El antipatrón que sustituye"
    doc: stack/estilos.md
    nota: >
      Verificado en la guía de actualización de Tailwind 4: esas hojas se compilan aparte y no ven
      el @theme, así que el @apply se queda sin resolver. La doc oficial NO desaconseja @apply en
      general — esta regla persigue el @apply que no funciona, no su uso.

  # ── capa rutas — react-router 7 (FE-1) ────────────────────────────────────────────────────
  - id: fe-enlace-interno-con-link
    enunciado: "La navegación interna usa <Link>/useNavigate, nunca <a href> ni window.location"
    eje: 2-capas
    capa: rutas
    mecanismo: script
    ambito: "src/**/*.tsx"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: activo
    baseline: null
    referencia: "stack/rutas.md §Implementación de referencia (la navegación)"
    doc: stack/rutas.md
    nota: >
      Solo rutas literales que empiezan por una barra; se ignora si lleva target, download o
      rel=external, y un href={variable} no se puede juzgar. El síntoma es engañoso: el enlace
      LLEVA a la página correcta, solo que recargando la app y vaciando la caché de queries.

  - id: fe-error-boundary-de-ruta
    enunciado: "createBrowserRouter siempre con ErrorBoundary en la raíz"
    eje: 3-errores
    capa: rutas
    mecanismo: script
    ambito: "src/**/*.{ts,tsx}"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: activo
    baseline: null
    referencia: "stack/rutas.md §Implementación de referencia (el ErrorBoundary)"
    doc: stack/rutas.md
    nota: >
      Sin él, un fallo de loader o de render deja la pantalla en blanco: ni mensaje, ni botón, ni
      nada que copiar para reportarlo. Comprueba el FICHERO del router, no cada ruta anidada — con
      uno en la raíz queda cubierto todo lo de debajo.

  - id: fe-rutas-en-un-sitio
    enunciado: "Las rutas se declaran en el módulo de rutas, no repartidas por componentes"
    eje: 1-estructura
    capa: rutas
    mecanismo: script
    ambito: "src/**/*.tsx"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
    referencia: "stack/rutas.md §El antipatrón que sustituye"
    doc: stack/rutas.md

  # ── capa saneado — DOMPurify (FE-1) ───────────────────────────────────────────────────────
  - id: fe-html-saneado
    enunciado: "dangerouslySetInnerHTML solo con DOMPurify.sanitize, y saneando al PINTAR"
    eje: 7-seguridad
    capa: saneado
    mecanismo: script      # refuerzo: react/no-danger + eslint-plugin-no-unsanitized
    ambito: "src/**/*.{ts,tsx}"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: activo
    baseline: null
    referencia: "stack/saneado.md §Implementación de referencia (SafeHtml)"
    doc: stack/saneado.md
    nota: >
      LÍMITE HONESTO: la comprobación es de fichero, no de flujo — verifica que el saneado APARECE,
      no que el valor que llega a __html sea el saneado. Hace imposible el descuido, no el error
      deliberado; eso lo cubren la revisión y sofia-pentester. Por eso el patrón mete el saneado en
      un componente único (SafeHtml): si nadie más escribe __html, no hay dónde equivocarse.

  - id: fe-sin-innerhtml
    enunciado: "Nada de .innerHTML / insertAdjacentHTML / document.write en código de aplicación"
    eje: 7-seguridad
    capa: saneado
    mecanismo: script      # refuerzo: no-unsanitized/property (sí sigue la asignación)
    ambito: "src/**/*.{ts,tsx}"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: activo
    baseline: null
    referencia: "stack/saneado.md §El antipatrón que sustituye"
    doc: stack/saneado.md
    nota: "Exento `.innerHTML = ''`: vaciar un nodo no inyecta nada y era el falso positivo obvio."

  # ── capa estilos · regla de PROYECTO — el sistema de diseño (EST-2) ───────────────────────
  - id: fe-origen-de-tokens
    enunciado: "Un único origen de tokens (@theme) y un documento fundacional que lo declare"
    eje: 1-estructura
    capa: estilos
    mecanismo: script
    ambito: "PROYECTO — el árbol entero (solo corre con --all)"
    origen: casa
    dominancia: "n/a — patrón declarado"
    estado: debil
    baseline: null
    referencia: "stack/frontend-design-system.md §Implementación de referencia (el procedimiento)"
    doc: stack/frontend-design-system.md
    nota: >
      DECISIÓN DEL USUARIO (EST-2): el template NO impone valores de diseño — ni paleta, ni escala,
      ni tipografía. Impone el CONTRATO: un origen único de tokens y un documento fundacional en
      .docs/core/design-system.md con el peso de la constitution.md de SpecKit. Esta es la ÚNICA
      regla del catálogo frontend que juzga el conjunto y no un fichero, y por eso solo corre con
      --all: desde un diff no se puede afirmar que al proyecto le falta algo. DÉBIL y con mensaje
      prescriptivo — dice qué crear, no falla en seco. NO comprueba que el documento esté relleno
      (solo que exista) ni que sus valores coincidan con los del @theme.

