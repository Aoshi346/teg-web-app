# PROPUESTA de entradas para `.claude/patterns/catalog.yaml` — mitad BACKEND del patrón de casa (US-7)
# ─────────────────────────────────────────────────────────────────────────────────────────────
# NO es el catálogo. Es el fichero de traspaso: el TL las integra en catalog.yaml.
# Generado junto a `.claude/patterns/stack/backend-*.md` + `pattern_check_backend.py`.
#
# ⚠️ LEER ANTES DE INTEGRAR — estas filas NO son como las tres que ya hay en catalog.yaml
#
# 1) Son DECLARADAS, no MEDIDAS. El catálogo actual exige "dominancia medida antes de fijar", y con
#    razón: se infiere del repo. Aquí no hay repo del que inferir — el template no tiene código
#    Django, y el caso de uso de US-7 es justamente el proyecto NUEVO, donde por definición no hay
#    precedentes. Por eso `dominancia: declarado` y por eso cada fila lleva `source:` a su doc.
#    Encaja con la regla R-9 de Rita: una regla declarada CON `source:` sustituye a los 2
#    precedentes, y se cita textual, nunca parafraseada.
#
# 2) `precedentes:` apunta a `_fixtures/conforme/`, que es código real, parseable y verificado
#    (0 hallazgos en `--self-test`). Rita puede citarlo como file:line igual que citaría el repo.
#
# 3) EL `estado` DE AQUÍ ES EL DE UN PROYECTO NUEVO. En un proyecto EXISTENTE manda lo que el repo
#    ya hace (doctrina de US-7: imponer el estilo de casa a un heredado haría que Rita marcara
#    medio repo). Protocolo al adoptar en un repo con código:
#         a. Sembrar TODAS las filas como `estado: sombra`.
#         b. Medir:  python3 .claude/patterns/stack/pattern_check_backend.py --all --json
#         c. Congelar lo preexistente en `baseline/<id>.json` (deuda aceptada) y promover a
#            `activo` solo las reglas cuya violación sea minoritaria (<20-30 sitios — regla de
#            inversión del README: si marcaría medio repo, la mala es la regla).
#
# 4) Mecanismo: todas son `ast` o `grep` (escalón determinista, 0 tokens). NINGUNA es "que lo mire
#    Rita": una regla sin comprobación ejecutable no está en este fichero, está en el informe como
#    descartada.
#
# Ejes usados (los dos primeros ya existen en catalog.yaml; los otros son NUEVOS — decisión del TL):
#   1-estructura · 4-dependencias · 2-datos · 3-seguridad · 5-concurrencia · 6-configuracion

project: tech-lead-template
measured: null                  # declarado, no medido — ver nota 1
source_set: ".claude/patterns/stack/"
