    doc: stack/backend-servicios.md

  - id: be-svc-escritura-en-vista
    enunciado: "Las vistas no escriben en la BD: delegan en un servicio (salvo serializer.save y hooks perform_* triviales)"
    eje: 1-estructura
    mecanismo: ast
    ambito: "**/views.py, **/views/**.py, **/viewsets.py"
    dominancia: declarado
    estado: activo
    baseline: null
    precedentes:
      - ".claude/patterns/stack/_fixtures/conforme/apps/facturacion/views.py:22"
      - ".claude/patterns/stack/_fixtures/conforme/apps/facturacion/services.py:44"
