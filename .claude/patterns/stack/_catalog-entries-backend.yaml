    eje: 1-estructura
    mecanismo: ast
    ambito: "**/services.py, **/services/**.py, **/use_cases/**.py, **/selectors.py"
    dominancia: declarado
    estado: activo
    baseline: null
    precedentes:
      - ".claude/patterns/stack/_fixtures/conforme/apps/facturacion/services.py:44"
      - ".claude/patterns/stack/_fixtures/conforme/apps/facturacion/views.py:33"
